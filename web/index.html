<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Pun Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #3d4449;
      --muted: #7f888f;
      --accent: #f56a6a;
      --accent-fg: #ffffff;
      --chip-bg: #f5f6f7;
      --border: #c8cccf;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #242629;
        --fg: #e6e8ea;
        --muted: #a0a7ad;
        --accent: #f56a6a;
        --accent-fg: #ffffff;
        --chip-bg: #2f3236;
        --border: #4a4f55;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: var(--bg);
      color: var(--fg);
      font: 300 1.15rem/1.65 "Source Sans Pro", Helvetica, Arial, sans-serif;
    }
    main { width: 100%; max-width: 40rem; }
    h1 {
      margin: 0 0 .25rem;
      font-weight: 600;
      letter-spacing: .1em;
      text-transform: uppercase;
      font-size: 1.1rem;
    }
    .sub { margin: 0 0 1.5rem; color: var(--muted); font-size: .95rem; }
    .chips { display: flex; flex-wrap: wrap; gap: .5rem; margin: 0 0 1.5rem; padding: 0; list-style: none; }
    button {
      font: inherit;
      cursor: pointer;
      border-radius: 4px;
    }
    .chip {
      padding: .2rem .9rem;
      font-size: .9rem;
      color: var(--fg);
      background: var(--chip-bg);
      border: 1px solid var(--border);
    }
    .chip[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-fg);
    }
    #pun {
      margin: 0 0 1.5rem;
      min-height: 5.5rem;
      font-size: 1.5rem;
      line-height: 1.4;
    }
    .more {
      padding: .65rem 1.8rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-size: .85rem;
      color: var(--accent-fg);
      background: var(--accent);
      border: 0;
    }
    .more:hover { filter: brightness(1.08); }
    button:focus-visible {
      outline: 3px solid var(--fg);
      outline-offset: 3px;
    }
    .meta { margin-top: 2rem; font-size: .85rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Pun Generator</h1>
    <p class="sub">The 2012 console app, now with a front end.</p>

    <ul class="chips" id="topics" aria-label="Filter by topic"></ul>

    <p id="pun" aria-live="polite">Loading a pun…</p>
    <button type="button" class="more" id="more" disabled>Another one</button>

    <p class="meta">Every pun appears once before any repeats.</p>
  </main>

  <script>
    (() => {
      const punEl = document.getElementById("pun");
      const moreBtn = document.getElementById("more");
      const topicsEl = document.getElementById("topics");
      const ALL = "all";

      let puns = [];
      let topic = ALL;
      const bags = new Map(); // topic -> remaining puns this cycle

      // Fisher–Yates, same shuffle-bag idea as the console app.
      function shuffle(list) {
        const a = [...list];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function next() {
        let bag = bags.get(topic) ?? [];
        if (bag.length === 0) {
          bag = shuffle(topic === ALL ? puns : puns.filter((p) => p.topic === topic));
          bags.set(topic, bag);
        }
        return bag.pop().text;
      }

      function showNext() {
        punEl.textContent = next();
      }

      function renderChips() {
        const topics = [ALL, ...new Set(puns.map((p) => p.topic))];
        for (const t of topics) {
          const li = document.createElement("li");
          const b = document.createElement("button");
          b.type = "button";
          b.className = "chip";
          b.textContent = t === ALL ? "All" : t;
          b.dataset.topic = t;
          b.setAttribute("aria-pressed", String(t === topic));
          li.appendChild(b);
          topicsEl.appendChild(li);
        }
      }

      topicsEl.addEventListener("click", (e) => {
        const chip = e.target.closest(".chip");
        if (!chip) return;
        topic = chip.dataset.topic;
        topicsEl.querySelectorAll(".chip").forEach((c) =>
          c.setAttribute("aria-pressed", String(c === chip)));
        showNext();
      });

      moreBtn.addEventListener("click", showNext);

      fetch("../data/puns.json")
        .then((res) => {
          if (!res.ok) throw new Error(res.status);
          return res.json();
        })
        .then((data) => {
          puns = data.puns;
          renderChips();
          moreBtn.disabled = false;
          showNext();
        })
        .catch(() => {
          punEl.textContent = "Couldn't load the puns. That's not punny.";
        });
    })();
  </script>
</body>
</html>
